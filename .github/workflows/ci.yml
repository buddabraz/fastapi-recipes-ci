name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [black, isort, flake8, mypy, pytest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        if: matrix.check == 'black'
        run: python -m black --check .
      - name: Check imports
        if: matrix.check == 'isort'
        run: python -m isort --check-only .
      - name: Check style
        if: matrix.check == 'flake8'
        run: python -m flake8 .
      - name: Check types
        if: matrix.check == 'mypy'
        run: python -m mypy
      - name: Run API tests
        if: matrix.check == 'pytest'
        run: python -m pytest -q
